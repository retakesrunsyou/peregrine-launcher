plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = 'net.peregrine'

base {
	archivesName = "peregrine-client-${project.minecraft_version}"
}

// The shared core: every feature lives there, written once for all versions.
sourceSets {
	main {
		java {
			srcDir file('../../core/src/main/java')
			// Small differences inside this adapter's range: src/mc-<version>/java when
			// it exists for the version being built, otherwise src/mc-default/java.
			def exact = file("src/mc-${project.minecraft_version}/java")
			srcDir(exact.exists() ? exact : file('src/mc-default/java'))
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def props = [version: project.version, minecraft: project.minecraft_version]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
