# When you publish a release on GitHub, this builds the launcher zip and the
# in-game mod and attaches both to the release. Players' launchers then offer
# "Update now", and the in-game mod updates itself on their next Play.
name: Build release files

on:
  release:
    types: [published]
  # "Run workflow" on the Actions tab: a test build of the in-game mod, no release needed.
  workflow_dispatch:
    inputs:
      minecraft:
        description: "Only build this Minecraft version (empty = all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag must match VERSION in peregrine/__init__.py, or installed
      # launchers would keep offering the same update forever.
      - name: Check the version number
        if: github.event_name == 'release'
        run: |
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"
          version="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' peregrine/__init__.py)"
          if [ "$tag" != "$version" ]; then
            echo "::error::The release tag is $tag but peregrine/__init__.py says VERSION = \"$version\". Make them match, then delete this release and publish it again."
            exit 1
          fi

      - name: Build the launcher zip
        if: github.event_name == 'release'
        run: |
          chmod +x make-release.sh
          ./make-release.sh

      - name: Attach the launcher zip
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ../peregrine-launcher.zip --clobber

      # Java 25 builds every version (26.x needs it; 1.21.x targets Java 21 either way).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build the in-game mod for every Minecraft version
        run: |
          chmod +x client/build.sh client/gradlew
          client/build.sh ${{ github.event.inputs.minecraft }} || echo "MOD_BUILD_FAILED=1" >> "$GITHUB_ENV"

      - name: Attach the in-game mod
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          jars=(client/dist/*.jar)
          if [ ${#jars[@]} -gt 0 ]; then
            gh release upload "${{ github.event.release.tag_name }}" "${jars[@]}" --clobber
          fi

      # Test builds only: show the Minecraft APIs the adapter compiled against,
      # so a broken version can be fixed without guessing.
      - name: Show Minecraft APIs (test builds)
        if: github.event_name == 'workflow_dispatch' && env.MOD_BUILD_FAILED == '1'
        run: |
          note() { local m; m="$(cat)"; m="${m//'%'/'%25'}"; m="${m//$'\n'/'%0A'}"; echo "::notice title=$1::${m:0:60000}"; }
          find ~/.gradle client -name '*.jar' 2>/dev/null | grep -iE 'lwjgl|sdl' | xargs -rn1 basename | sort -u | note "input libraries"
          mcjar=""
          for j in $(find ~/.gradle client -name '*.jar' -size +5M 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/Minecraft.class'; then mcjar="$j"; break; fi
          done
          echo "$mcjar" | note "minecraft jar"
          [ -n "$mcjar" ] || exit 0
          for c in com.mojang.blaze3d.platform.InputConstants net.minecraft.client.KeyMapping net.minecraft.client.Minecraft net.minecraft.client.MouseHandler net.minecraft.client.gui.screens.Screen; do
            javap -cp "$mcjar" -public "$c" 2>&1 | grep -vE 'lambda\$' | head -400 | note "$c"
          done
          unzip -l "$mcjar" | grep -oE 'com/mojang/blaze3d/platform/[A-Za-z]+\.class|net/minecraft/client/input/[A-Za-z]+\.class' | sort -u | note "input classes"

      # Versions that built are already attached; this just makes a failure visible.
      - name: Report versions that failed to build
        if: env.MOD_BUILD_FAILED == '1'
        run: |
          echo "::error::Some Minecraft versions failed to build. Open the 'Build the in-game mod' step above for the error."
          exit 1
