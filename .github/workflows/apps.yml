# Builds the standalone apps: a Windows installer (Peregrine-Setup.exe) and a
# Linux AppImage (Peregrine-x86_64.AppImage). On a published release both are
# attached to it. "Run workflow" on the Actions tab builds them without a release.
name: Build apps

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install --quiet -r requirements.txt pyinstaller pillow
      - name: Build Peregrine.exe
        shell: bash
        run: |
          mkdir -p log
          pyinstaller --noconfirm --clean --windowed --name Peregrine \
            --icon assets/peregrine.ico \
            --add-data "assets:assets" --add-data "peregrine.svg:." \
            --paths . --collect-submodules peregrine \
            --exclude-module tkinter \
            packaging/launch.py 2>&1 | tail -n 40 > log/windows-build.txt
          ls dist/Peregrine
      - name: The app starts and quits cleanly
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          LOCALAPPDATA: ${{ runner.temp }}\smoke\local
          APPDATA: ${{ runner.temp }}\smoke\roaming
        run: |
          $p = Start-Process -FilePath dist\Peregrine\Peregrine.exe -ArgumentList '--smoke' -PassThru
          $done = $p.WaitForExit(60000)
          Get-ChildItem "$env:LOCALAPPDATA\Peregrine\logs" -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 80 } | Out-File -Encoding utf8 log\windows-smoke.txt
          if (-not $done) { $p.Kill(); throw 'Peregrine.exe did not quit by itself' }
          if ($p.ExitCode -ne 0) { throw "Peregrine.exe exited with code $($p.ExitCode)" }
          if (-not (Test-Path "$env:APPDATA\Peregrine")) { throw 'no settings folder was made' }
          Write-Output 'started and quit cleanly'
      - name: Build the installer
        shell: bash
        run: |
          mkdir -p payload
          python - <<'PY'
          import pathlib, zipfile
          src = pathlib.Path("dist/Peregrine")
          with zipfile.ZipFile("payload/payload.zip", "w", zipfile.ZIP_LZMA) as z:
              for p in sorted(src.rglob("*")):
                  if p.is_file():
                      z.write(p, p.relative_to(src).as_posix())
          PY
          ls -la payload/payload.zip
          pyinstaller --noconfirm --onefile --windowed --name Peregrine-Setup \
            --icon assets/peregrine.ico \
            --add-data "payload/payload.zip:." \
            --paths . --exclude-module tkinter \
            --distpath dist-setup --workpath build-setup \
            packaging/setup_app.py 2>&1 | tail -n 30 > log/setup-build.txt
          mv dist-setup/Peregrine-Setup.exe dist/
          ls -la dist/Peregrine-Setup.exe
      - name: The installer installs silently, and again over itself
        shell: pwsh
        run: |
          foreach ($round in 1, 2) {
            $p = Start-Process -FilePath dist\Peregrine-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon' -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "installer exited with code $($p.ExitCode) (round $round)" }
          }
          $dir = "$env:LOCALAPPDATA\Programs\Peregrine"
          $exe = "$dir\Peregrine.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          $desk = [Environment]::GetFolderPath('Desktop')
          $lnk = "$desk\Peregrine Launcher.lnk"
          if (-not (Test-Path $lnk)) { throw 'no desktop shortcut' }
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Peregrine Launcher.lnk"
          if (-not (Test-Path $menu)) { throw 'no Start menu shortcut' }
          $sh = New-Object -ComObject Shell.Application
          $item = $sh.NameSpace($desk).ParseName('Peregrine Launcher.lnk')
          $aumid = $item.ExtendedProperty('System.AppUserModel.ID')
          "taskbar id on the shortcut: $aumid" | Tee-Object -FilePath log\install-check.txt
          if ($aumid -ne 'Peregrine.Launcher') { throw 'the shortcut has no taskbar id' }
          $key = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Peregrine'
          "Apps entry: $($key.DisplayName) $($key.DisplayVersion), $($key.EstimatedSize) KB, uninstall: $($key.UninstallString)" | Tee-Object -Append -FilePath log\install-check.txt
          if ($key.DisplayName -ne 'Peregrine Launcher') { throw 'no Apps entry' }
      - name: The installed app starts, then uninstalls cleanly
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $log = 'log\install-check.txt'
          function Say($t) { $t | Tee-Object -Append -FilePath $log }
          $dir = "$env:LOCALAPPDATA\Programs\Peregrine"
          $p = Start-Process -FilePath "$dir\Peregrine.exe" -ArgumentList '--smoke' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Say 'installed app did not quit'; exit 1 }
          Say "installed app smoke exit code: $($p.ExitCode)"
          $p = Start-Process -FilePath "$dir\Peregrine.exe" -ArgumentList '--uninstall','--quiet' -PassThru
          $p.WaitForExit(60000) | Out-Null
          Say "uninstaller exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 10
          Get-ChildItem "$env:LOCALAPPDATA\Peregrine\logs" -ErrorAction SilentlyContinue | ForEach-Object { Say "== $($_.Name)"; Get-Content $_.FullName -Tail 40 | ForEach-Object { Say $_ } }
          $fail = @()
          if (Test-Path "$dir\Peregrine.exe") { $fail += 'the app folder is still there'; Get-ChildItem $dir | Select-Object -First 10 | ForEach-Object { Say "  left: $($_.Name)" } }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Peregrine') { $fail += 'the Apps entry is still there' }
          $desk = [Environment]::GetFolderPath('Desktop')
          if (Test-Path "$desk\Peregrine Launcher.lnk") { $fail += 'the desktop shortcut is still there' }
          if (-not (Test-Path "$env:APPDATA\Peregrine")) { $fail += 'settings were removed but should stay' }
          if ($fail.Count) { $fail | ForEach-Object { Say "FAIL $_" }; exit 1 }
          Say 'uninstalled cleanly, settings kept'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/Peregrine-Setup.exe
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/Peregrine-Setup.exe --clobber

  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0 libegl1 libxkbcommon-x11-0 libfuse2 desktop-file-utils >/dev/null
          pip install --quiet -r requirements.txt pyinstaller
          mkdir -p log
      - name: Build the app
        run: |
          pyinstaller --noconfirm --clean --windowed --name Peregrine \
            --add-data "assets:assets" --add-data "peregrine.svg:." \
            --paths . --collect-submodules peregrine \
            --exclude-module tkinter \
            packaging/launch.py 2>&1 | tail -n 40 > log/appimage-build.txt
      - name: Make the AppImage
        run: |
          app=Peregrine.AppDir
          mkdir -p "$app/usr/bin"
          cp -a dist/Peregrine/. "$app/usr/bin/"
          cp assets/peregrine-512.png "$app/peregrine.png"
          ln -s peregrine.png "$app/.DirIcon"
          cat > "$app/peregrine.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Peregrine Launcher
          GenericName=Minecraft Launcher
          Comment=Launch and speed up Minecraft: Java Edition
          Exec=Peregrine %U
          Icon=peregrine
          StartupWMClass=peregrine
          Categories=Game;
          Terminal=false
          EOF
          sed -i 's/^ *//' "$app/peregrine.desktop"
          desktop-file-validate "$app/peregrine.desktop"
          cat > "$app/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/Peregrine" "$@"
          EOF
          sed -i 's/^ *//' "$app/AppRun"
          chmod +x "$app/AppRun"
          curl -sSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$app" Peregrine-x86_64.AppImage 2>&1 | tail -n 20 > log/appimagetool.txt
          ls -la Peregrine-x86_64.AppImage
      - name: The AppImage starts and quits cleanly
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          timeout 60 ./Peregrine-x86_64.AppImage --smoke > log/appimage-smoke.txt 2>&1 || { code=$?; cat log/appimage-smoke.txt; cat ~/.local/share/peregrine/logs/* >> log/appimage-smoke.txt 2>/dev/null; echo "exit $code" >> log/appimage-smoke.txt; exit 1; }
          test -f ~/.local/share/applications/peregrine.desktop
          desktop-file-validate ~/.local/share/applications/peregrine.desktop
          echo "started, added itself to the app menu, and quit cleanly"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: Peregrine-x86_64.AppImage
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Peregrine-x86_64.AppImage --clobber

