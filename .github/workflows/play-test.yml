# Plays every supported Minecraft version through the launcher on a virtual
# screen and checks the in-game mod: main menu, Right Shift menu, search,
# toggles, HUD editor and dragging, zoom, mouse clicks. Run it from the
# Actions tab before publishing a release. Results and screenshots are saved
# to the "test-results" branch.
name: Play test

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Minecraft versions to test, space separated (empty = all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          want="${{ github.event.inputs.versions }}"
          if [ -z "$want" ]; then
            want="$(cat client/versions/*/targets.txt | grep -vE '^\s*(#|$)' | awk '{print $1}' | tr '\n' ' ')"
          fi
          echo "list=$(printf '%s\n' $want | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Core tests (the in-game menu's logic)
        run: |
          curl -sSLo gson.jar https://repo1.maven.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar
          mkdir -p build/core build/tests
          javac --release 8 -nowarn -cp gson.jar -d build/core $(find client/core/src/main/java -name '*.java')
          javac -nowarn -cp gson.jar:build/core -d build/tests tests/core/*.java
          java -cp gson.jar:build/core:build/tests CoreTest
          java -cp gson.jar:build/core:build/tests CompatTest
      - name: Launcher tests
        run: |
          pip install --quiet 'requests[socks]'
          python3 tests/test_launcher.py

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System packages the installer asks for
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-venv libxcb-cursor0 libegl1 libxkbcommon-x11-0 desktop-file-utils zip >/dev/null
      - name: Build the release zip and install it like a player
        run: |
          ./make-release.sh
          mkdir -p /tmp/rel && cd /tmp/rel && unzip -q "$GITHUB_WORKSPACE/../peregrine-launcher.zip"
          bash /tmp/rel/peregrine/install.sh
          test -x ~/.local/bin/peregrine
          desktop-file-validate ~/.local/share/applications/peregrine.desktop
          ls ~/.local/share/icons/hicolor/256x256/apps/peregrine.png
      - name: The app starts and keeps running
        run: |
          mkdir -p ~/.local/share/peregrine/instances/keep-me && echo '{}' > ~/.local/share/peregrine/instances/keep-me/instance.json
          set +e
          QT_QPA_PLATFORM=offscreen timeout 20 ~/.local/bin/peregrine > app.log 2>&1
          code=$?
          cat app.log
          [ "$code" = 124 ] || { echo "::error::The launcher exited by itself with code $code"; exit 1; }
      - name: Self-update installs over the old version and keeps player data
        run: |
          cd /tmp && python3 -m http.server 8765 --directory "$GITHUB_WORKSPACE/.." >/dev/null 2>&1 &
          sleep 1
          cd ~/.local/share/peregrine/app
          ./venv/bin/python -c "
          from peregrine import updater
          assert updater.installed_app_dir() is not None, 'not seen as installed'
          updater.apply({'version': '9.9.9', 'url': 'http://127.0.0.1:8765/peregrine-launcher.zip'})
          print('update applied')
          "
          test -f ~/.local/share/peregrine/instances/keep-me/instance.json
          code=0
          QT_QPA_PLATFORM=offscreen timeout 15 ~/.local/bin/peregrine >/dev/null 2>&1 || code=$?
          [ "$code" = 124 ] || { echo "::error::The updated launcher exited by itself with code $code"; exit 1; }

  play:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        minecraft: ${{ fromJson(needs.versions.outputs.list) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install the virtual screen and input tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-apps x11-utils xdotool imagemagick libgl1-mesa-dri mesa-vulkan-drivers libxcb-cursor0 >/dev/null
          pip install --quiet 'requests[socks]'

      - name: Build the mod
        run: |
          chmod +x client/build.sh client/gradlew
          client/build.sh ${{ matrix.minecraft }}

      - name: Play
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          python3 tests/play_test.py "${{ matrix.minecraft }}" client/dist "out/${{ matrix.minecraft }}"

      - name: Shrink screenshots and logs
        if: always()
        run: |
          d="out/${{ matrix.minecraft }}"
          mkdir -p "$d"
          rm -rf "$d/home" "$d/server"
          for f in "$d"/*.png; do [ -f "$f" ] && convert "$f" -resize 960x -quality 80 "${f%.png}.jpg" && rm "$f"; done
          find "$d" -name '*.log' -size +2M -exec sh -c 'tail -c 2000000 "$1" > "$1.tail" && mv "$1.tail" "$1"' _ {} \;
          cp client/dist/build-*.log "$d/" 2>/dev/null || true
          ls -la "$d"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-${{ matrix.minecraft }}
          path: out/${{ matrix.minecraft }}

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.1', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install the virtual screen and the launcher's libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libxcb-cursor0 imagemagick >/dev/null
          pip install --quiet -r requirements.txt
      - name: Build the mod
        run: |
          chmod +x client/build.sh client/gradlew
          client/build.sh ${{ matrix.minecraft }}
      - name: Use the launcher
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a -s "-screen 0 1280x720x24" python3 tests/ui_test.py "${{ matrix.minecraft }}" client/dist "out/ui-${{ matrix.minecraft }}"
      - name: Shrink screenshots
        if: always()
        run: |
          d="out/ui-${{ matrix.minecraft }}"
          mkdir -p "$d"; rm -rf "$d/home"
          for f in "$d"/*.png; do [ -f "$f" ] && convert "$f" -quality 82 "${f%.png}.jpg" && rm "$f"; done
          find "$d" -name '*.log' -size +2M -exec sh -c 'tail -c 2000000 "$1" > "$1.tail" && mv "$1.tail" "$1"' _ {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-ui-${{ matrix.minecraft }}
          path: out/ui-${{ matrix.minecraft }}

  save:
    needs: [play, ui, unit, install]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Save to the test-results branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd results
          for d in play-*; do mv "$d" "${d#play-}"; done
          {
            echo "Play test, run ${{ github.run_id }}"
            for d in */; do
              v="${d%/}"
              if [ -f "$v/summary.txt" ]; then
                fails="$(grep -c '^FAIL' "$v/summary.txt" || true)"
                bench="$(grep -o '^INFO [a-z-]*: benchmark: [0-9]* fps' "$v/summary.txt" | sed -E 's/^INFO ([a-z-]*): benchmark: ([0-9]*) fps/\1 \2/' | tr '\n' ' ')"
                echo "$v: $fails failed${bench:+   fps: $bench}"
              else
                echo "$v: no summary (the test didn't run to the end)"
              fi
            done
          } > README.txt
          cat README.txt
          git init -q -b test-results
          git -c user.name=Peregrine -c user.email=noreply@users.noreply.github.com add -A
          git -c user.name=Peregrine -c user.email=noreply@users.noreply.github.com commit -qm "Play test results"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" test-results
